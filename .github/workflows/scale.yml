name: scale
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets-500k:
    name: scheduled-scale-500k
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv v9.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked --all-extras --dev
      - name: Execute real disk-backed reconcile and publication at 500k assets
        env:
          IMMICH_EXPORT_SCALE_ASSETS: "500000"
        run: uv run pytest -q tests/test_scale_budgets.py
